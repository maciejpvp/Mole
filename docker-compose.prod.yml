services:
  nginx:
    image: maciekpvp/mole-nginx:latest
    container_name: mole-proxy
    restart: unless-stopped
    user: root
    depends_on:
      mole-control-plane:
        condition: service_healthy
      mole-frontend:
        condition: service_started
    networks:
      - mole-internal
    ports:
      - "80:80"
      - "443:443"
      - "${MOLE_CONTROL_PORT:-9000}:9000/tcp" # Stream Proxied Control Port
    # Configs are baked into the image via nginx/Dockerfile
    deploy:
      resources:
        limits:
          memory: 96M

  postgres:
    image: postgres:17
    container_name: mole-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BLUEPRINT_DB_DATABASE:-mole}
      POSTGRES_USER: ${BLUEPRINT_DB_USERNAME:-mole}
      POSTGRES_PASSWORD: ${BLUEPRINT_DB_PASSWORD:-change-me-in-production}
    networks:
      - mole-internal
    volumes:
      - psql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BLUEPRINT_DB_USERNAME:-mole}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  mole-control-plane:
    image: maciekpvp/mole-control-plane:latest
    container_name: mole-control-plane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mole-internal
    # Note: Port 8080 is NOT exposed publicly on host. Traffic flows through Nginx (mole-proxy).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      PORT: 8080
      BLUEPRINT_DB_DATABASE: ${BLUEPRINT_DB_DATABASE:-mole}
      BLUEPRINT_DB_USERNAME: ${BLUEPRINT_DB_USERNAME:-mole}
      BLUEPRINT_DB_PASSWORD: ${BLUEPRINT_DB_PASSWORD:-change-me-in-production}
      BLUEPRINT_DB_HOST: postgres
      BLUEPRINT_DB_PORT: 5432
      BLUEPRINT_DB_SCHEMA: public
      MOLE_CONTROL_PORT: ${MOLE_CONTROL_PORT:-9000}
      MOLE_TUNNEL_PORT_MIN: ${MOLE_TUNNEL_PORT_MIN:-10000}
      MOLE_TUNNEL_PORT_MAX: ${MOLE_TUNNEL_PORT_MAX:-10100}
      MOLE_PUBLIC_HOST: ${MOLE_PUBLIC_HOST:-localhost}
      MOLE_GLOBAL_TRANSFER_LIMIT_BYTES: ${MOLE_GLOBAL_TRANSFER_LIMIT_BYTES:-5497558138880}
      MOLE_SERVER_STATE_DIR: /var/lib/mole-server
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-50}
      AUTH_RATE_LIMIT_RPS: ${AUTH_RATE_LIMIT_RPS:-2}
      AUTH_RATE_LIMIT_BURST: ${AUTH_RATE_LIMIT_BURST:-5}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost/api/v1/auth/google/callback}
      GOOGLE_FRONTEND_URL: ${GOOGLE_FRONTEND_URL:-http://localhost}
      GOOGLE_COOKIE_SECURE: ${GOOGLE_COOKIE_SECURE:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY must be set for production}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET must be set for production}
      BLOCKED_IPS: ${BLOCKED_IPS:-}
      ALLOWED_IPS: ${ALLOWED_IPS:-}
    ports:
      - "${MOLE_TUNNEL_PORT_MIN:-10000}-${MOLE_TUNNEL_PORT_MAX:-10100}:${MOLE_TUNNEL_PORT_MIN:-10000}-${MOLE_TUNNEL_PORT_MAX:-10100}/tcp"
      - "${MOLE_TUNNEL_PORT_MIN:-10000}-${MOLE_TUNNEL_PORT_MAX:-10100}:${MOLE_TUNNEL_PORT_MIN:-10000}-${MOLE_TUNNEL_PORT_MAX:-10100}/udp"
    volumes:
      - mole_server_state:/var/lib/mole-server
    deploy:
      resources:
        limits:
          memory: 192M

  mole-frontend:
    image: maciekpvp/mole-frontend:latest
    container_name: mole-frontend
    restart: unless-stopped
    networks:
      - mole-internal
    # Not exposed publicly — nginx proxies / to mole-frontend:3000
    deploy:
      resources:
        limits:
          memory: 64M

networks:
  mole-internal:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.200.1.0/24
          gateway: 10.200.1.1

volumes:
  psql_data:
  mole_server_state:
