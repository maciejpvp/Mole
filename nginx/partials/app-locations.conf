# ==============================================================================
# Application routing — included by BOTH the :80 server (while no TLS
# certificate exists) and the :443 server (once one does). Defined once here so
# the two servers can never drift apart.
#
# Not a standalone config: it must be included from inside a `server { }` block.
# ==============================================================================

# ---- Control Plane API (keeps /api prefix when forwarding) ----
location /api/ {
    proxy_pass http://mole-control-plane:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---- SSE Event Streaming (buffering off for real-time events) ----
location ~ ^/api/v1/(tunnels/)?events {
    proxy_pass http://mole-control-plane:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 24h;
}

# ---- Frontend (default: serve SPA, all unknown routes → index.html) ----
location / {
    proxy_pass http://mole-frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
