# ==============================================================================
# Port 80. Always present, so the ACME HTTP-01 challenge is answerable from the
# first second the container is up.
#
# What the rest of this server does is decided at container start by
# docker-entrypoint.d/40-mole-tls-sync.sh, which writes tls.d/http-root.conf:
#   - no certificate yet → that file includes partials/app-locations.conf, and
#     the site is served over plain HTTP.
#   - certificate present → that file redirects everything to HTTPS, and the
#     real site is served by the :443 server in tls.d/ssl.conf.
# ==============================================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # `^~` stops nginx evaluating regex locations for this prefix, so the SSE
    # regex in app-locations.conf can never shadow the ACME challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Glob: matches zero files before the entrypoint has run or if it fails.
    # A non-glob include of a missing file is a fatal config error.
    include /etc/nginx/tls.d/http-root*.conf;
}
