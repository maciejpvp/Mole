server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ---- Control Plane API (keeps /api prefix when forwarding) ----
    location /api/ {
        proxy_pass http://mole-control-plane:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SSE Event Streaming (buffering off for real-time events) ----
    location ~ ^/api/v1/(tunnels/)?events {
        proxy_pass http://mole-control-plane:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # ---- Frontend (default: serve SPA, all unknown routes → index.html) ----
    location / {
        proxy_pass http://mole-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
